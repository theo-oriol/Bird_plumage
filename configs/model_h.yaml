# DINOv3 'H' tier = dinov3_vit7b16 (7B parameters): needs far more than 16 GB of GPU memory
backbone:
  name: dinov3_vit7b16
  lora:
    r: 8
    alpha: 18
    dropout: 0.05
    target_modules: [attn.qkv, attn.proj]   # every block, matched by suffix
feat_dim: 4096        # DINOv3 ViT-7B/16 embedding size
num_habitats: 10
head_dropout: 0.1
