# Model (protocol §1): frozen backbone except LoRA; attention pooling and heads trained from scratch
backbone:
  name: dinov3_vits16   # ViT-S (vitl16 took ~8 h per epoch)
  lora:
    r: 8
    alpha: 18
    dropout: 0.05
    target_modules: [attn.qkv, attn.proj]   # every block, matched by suffix
feat_dim: 384          # DINOv3-S embedding size, must match the backbone
num_habitats: 10
head_dropout: 0.1
