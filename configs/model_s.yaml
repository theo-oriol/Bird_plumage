# DINOv3-S variant; LoRA and head settings as in the other sizes (cheapest, good for smoke tests)
backbone:
  name: dinov3_vits16
  lora:
    r: 8
    alpha: 18
    dropout: 0.05
    target_modules: [attn.qkv, attn.proj]   # every block, matched by suffix
feat_dim: 384         # DINOv3-S (ViT-S/16) embedding size
num_habitats: 10
head_dropout: 0.1
