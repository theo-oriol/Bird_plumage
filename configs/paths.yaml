# Paths for training and evaluation; ${VAR} roots come from .env (see src/env.py)

# NPY dataset: one .rgb.zst + .cand_128.zst + .cand_224.zst per specimen (Back folder)
dataset_dir: ${DATASETS_DIR}/Familly_split_no_ablation/NEW_Segmented-Aves-Back-NPY

# Offline caches: each path names the Back folder; Belly and Side are its siblings

# A2 cache (scripts/build_a2_cache.py)
dataset_a2_dir: ${DATASETS_DIR}/Familly_split_A2/NEW_Segmented-Aves-Back-NPY

# A1 and A7 caches (scripts/build_a1_cache.py, scripts/build_a7_cache.py)
dataset_a1_dir: ${DATASETS_DIR}/Familly_split_A1/NEW_Segmented-Aves-Back-NPY
dataset_a7_dir: ${DATASETS_DIR}/Familly_split_A7/NEW_Segmented-Aves-Back-NPY

# A6 classification cache, one int8 label map per specimen (scripts/build_a6_classification_cache.py)
dataset_a6_classification_dir: ${DATASETS_DIR}/Familly_split_A6_classification/NEW_Segmented-Aves-Back-NPY

# Fold tables, crosswalk and habitat labels, all inside this repository
fold_dir: ${REPO_ROOT}/data/cross/cross_version_1_FAM
crosswalk_csv: ${REPO_ROOT}/data/raw/crosswalk_image_habitat_v0.csv
habitat_codes_json: ${REPO_ROOT}/configs/labelname.json
habitat_names_json: ${REPO_ROOT}/configs/labeltoname.json

# Colour module (A1, A2, A6): src/color.py with src/resources/w2c.mat

# DINOv3: local torch.hub repo and weights, one entry per backbone name (vit7b16 stands in for 'H')
dinov3_repo: ${DINOV3_REPO}
dinov3_weights:
  dinov3_vits16: ${DINOV3_WEIGHTS_DIR}/dinov3_vits16.pth
  dinov3_vitl16: ${DINOV3_WEIGHTS_DIR}/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  dinov3_vit7b16: ${DINOV3_WEIGHTS_DIR}/dinov3_vit7b16_pretrain_lvd1689m-a955f4ea.pth

# Where run outputs (checkpoints, logs, resolved configs) get written.
runs_dir: ${REPO_ROOT}/runs
